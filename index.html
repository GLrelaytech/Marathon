<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Season 2027 — Plovdiv, Bairi, Vitosha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E7E9; --card:#FAFBFB; --card2:#EEF1F3; --ink:#131C22; --soft:#5C6C76; --faint:#87949C; --rule:#CBD2D6;
  --rec:#6E9DC2; --easy:#2F7F60; --mp:#B98A22; --st:#C9702A; --hard:#8E2521; --vert:#6B4E8F;
  --gym:#4F5F69; --test:#1F6F8B; --swim:#3C8FA6; --race:#131C22; --rest:#A7B0B5; --yoga:#8DAA84;
  --base:#2F7F60; --build:#B98A22; --mara:#C9702A; --taper:#6E9DC2; --bairi:#6B4E8F; --vit:#8E2521;
  --done:#E3EEE8; --shadow:0 1px 2px rgba(19,28,34,.06),0 4px 14px rgba(19,28,34,.05);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11171B; --card:#192127; --card2:#1F2930; --ink:#E6ECEF; --soft:#A2B0B8; --faint:#7A8890; --rule:#2E3A42;
    --rec:#7FB0D6; --easy:#4FAE88; --mp:#D9AA45; --st:#E08A45; --hard:#D2584F; --vert:#A68BD0;
    --gym:#93A6B2; --test:#4FAACB; --swim:#5BB4CC; --race:#E6ECEF; --rest:#5E6A71;
    --done:#1C2E26; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11171B; --card:#192127; --card2:#1F2930; --ink:#E6ECEF; --soft:#A2B0B8; --faint:#7A8890; --rule:#2E3A42;
  --rec:#7FB0D6; --easy:#4FAE88; --mp:#D9AA45; --st:#E08A45; --hard:#D2584F; --vert:#A68BD0;
  --gym:#93A6B2; --test:#4FAACB; --swim:#5BB4CC; --race:#E6ECEF; --rest:#5E6A71;
  --done:#1C2E26; --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
.cond{font-family:'Barlow Condensed','IBM Plex Sans',sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--st);outline-offset:2px}
.hidden{display:none!important}

/* hero */
.hero{padding:30px 0 18px}
.hero-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(78px,21vw,136px);line-height:.8;letter-spacing:-.02em}
.big-lbl{padding-bottom:8px}
.big-lbl b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:clamp(22px,5vw,30px);line-height:1;font-weight:700}
.big-lbl span{color:var(--soft);font-size:14px}
.races{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.rc{border-top:3px solid var(--c);padding:7px 0 0}
.rc b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:19px;line-height:1.1}
.rc span{display:block;font-size:12.5px;color:var(--soft);line-height:1.35}
.rc.past{opacity:.45}

/* season ribbon — the signature */
.ribbon{margin-top:22px}
.rib{display:grid;grid-template-columns:repeat(35,1fr);gap:2px;align-items:end;height:46px}
.rib button{border:0;padding:0;height:22px;border-radius:2px;background:var(--pc);opacity:.55;cursor:pointer;position:relative}
.rib button.light{height:14px}
.rib button.raceW{height:34px;opacity:.9}
.rib button.now{opacity:1;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.rib button.sel{opacity:1}
.rib-k{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:7px;gap:8px}
.phases{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--soft);margin-top:6px}
.phases i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);
  display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:18px;color:var(--soft);padding:12px 12px 9px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* week */
.wkbar{display:flex;align-items:center;gap:8px;margin-top:16px}
.wkbar button{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:7px 12px;cursor:pointer}
.wkbar button:disabled{opacity:.35;cursor:default}
.wkbar .today{margin-left:auto}
.banner{margin-top:12px;padding:11px 14px;border-left:3px solid var(--rec);background:var(--card);font-size:14px}
.week{background:var(--card);border:1px solid var(--rule);border-radius:3px;margin-top:12px;box-shadow:var(--shadow);overflow:hidden}
.wk-head{padding:15px 16px 12px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);border-top:4px solid var(--pc)}
.wk-head h2{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:27px;line-height:1;font-weight:700}
.wk-head .sub{font-size:13px;color:var(--soft);margin-top:5px}
.wk-num{text-align:right;flex-shrink:0;font-size:12px;color:var(--soft);line-height:1.3}
.wk-num b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:23px;color:var(--ink);line-height:1}
.why{padding:10px 16px;background:var(--card2);font-size:13.5px;color:var(--soft);border-bottom:1px solid var(--rule)}
.why b{color:var(--ink)}
.prog{padding:10px 16px 0;font-size:12.5px;color:var(--soft);display:flex;justify-content:space-between}
.pbar{margin:6px 16px 12px;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--easy);transition:width .3s}
.day{border-top:1px solid var(--rule);padding:10px 16px 6px}
.day-h{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;color:var(--soft);display:flex;gap:8px;align-items:baseline}
.day-h .dt{font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:400;color:var(--faint)}
.day-h .hd{font-size:12px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;color:var(--st)}
.day.today .day-h{color:var(--ink)}
.day.today{background:linear-gradient(90deg,var(--card2),transparent)}
.it{display:flex;gap:11px;padding:8px 0 8px;align-items:flex-start}
.box{flex-shrink:0;width:22px;height:22px;border:1.5px solid var(--rule);border-radius:3px;background:var(--card);cursor:pointer;
  display:grid;place-items:center;margin-top:1px;padding:0}
.box svg{width:14px;height:14px;opacity:0}
.it.on .box{background:var(--easy);border-color:var(--easy)}
.it.on .box svg{opacity:1}
.zbar{width:4px;align-self:stretch;border-radius:2px;background:var(--zc);flex-shrink:0}
.ib{flex:1;min-width:0}
.it.on .ib .t{text-decoration:line-through;text-decoration-thickness:1px;color:var(--soft)}
.t{font-weight:600;font-size:15px}
.t small{font-weight:400;color:var(--soft);font-size:12.5px;margin-left:6px}
.d{font-size:13.5px;color:var(--soft);margin-top:2px}
.lg-t{background:none;border:0;padding:0;margin-top:5px;font-size:12.5px;color:var(--test);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}
.lg input,.lg textarea{width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
.lg textarea{grid-column:1/-1;min-height:52px;resize:vertical}
.lg label{font-size:11.5px;color:var(--soft);display:block}
.logged{font-size:12.5px;color:var(--easy);margin-top:3px}

/* panels */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:3px;margin-top:14px;box-shadow:var(--shadow)}
.panel h3{margin:0;padding:14px 16px 0;font-family:'Barlow Condensed',sans-serif;font-size:23px;line-height:1.1}
.panel .pc{padding:8px 16px 14px}
.panel p{margin:6px 0}
.panel ul{margin:6px 0;padding-left:18px}
.panel li{margin:4px 0}
.panel h4{margin:12px 0 2px;font-size:15px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--soft);font-size:12.5px;padding:6px 8px 6px 0;border-bottom:1px solid var(--rule)}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.note{border-left:3px solid var(--mp);padding:8px 12px;background:var(--card2);margin:10px 0;font-size:14px}
.warn{border-left-color:var(--hard)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--card2);color:var(--soft);margin-left:4px}

/* challenges */
.ch{padding:12px 16px;border-top:1px solid var(--rule)}
.ch:first-of-type{border-top:0}
.ch-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ch-h b{font-size:16px}
.ch-goal{font-size:12.5px;color:var(--soft);text-align:right}
.ch-hist{font-size:13px;color:var(--soft);margin-top:4px}
.ch-hist .best{color:var(--easy);font-weight:600}
.ch-add{display:flex;gap:6px;margin-top:7px}
.ch-add input{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
.ch-add input[type=date]{flex:0 0 140px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:3px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.ylist{list-style:none;margin:0;padding:2px 16px 14px}
.ylist li{padding:6px 0;border-top:1px solid var(--rule);font-size:14px}
.ylist li:first-child{border-top:0}
.ylist a{color:var(--ink);text-decoration:none}
.ylist a:hover{text-decoration:underline}
.ylist a.p::before{content:"★ ";color:var(--mp)}
.yc{font-size:13px;color:var(--soft);font-weight:400;margin-left:8px;font-family:'IBM Plex Sans',sans-serif}
.lg-t+.lg-t{margin-left:12px}
.x{background:none;border:0;color:var(--faint);cursor:pointer;padding:0 3px;font-size:13px}

/* check-in */
.ci{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ci label{font-size:12.5px;color:var(--soft)}
.ci input,.ci textarea,.ci select{width:100%;font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
.ci .full{grid-column:1/-1}
.ci textarea{min-height:70px}
#ciOut{width:100%;min-height:200px;font:13px/1.45 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink);margin-top:10px}
.foot{margin-top:28px;font-size:12.5px;color:var(--faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot button{background:none;border:0;color:var(--faint);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:3px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:520px){ .races{grid-template-columns:1fr;gap:10px} .rc{display:flex;gap:10px;align-items:baseline;border-top:0;border-left:3px solid var(--c);padding:0 0 0 9px} .rc b{min-width:90px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <div class="big" id="cd">—</div>
      <div class="big-lbl"><b id="cdName">days</b><span id="cdSub"></span></div>
    </div>
    <div class="races" id="races"></div>
    <div class="ribbon">
      <div class="rib" id="rib" aria-label="Season weeks"></div>
      <div class="rib-k"><span>26 Oct</span><span>Tap a week to open it</span><span>Late Jun</span></div>
      <div class="phases" id="phases"></div>
    </div>
  </header>

  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="plan">Plan</button>
    <button role="tab" aria-selected="false" data-tab="races">Races</button>
    <button role="tab" aria-selected="false" data-tab="gym">Strength</button>
    <button role="tab" aria-selected="false" data-tab="yoga">Yoga</button>
    <button role="tab" aria-selected="false" data-tab="ch">Challenges</button>
    <button role="tab" aria-selected="false" data-tab="zones">Zones and rules</button>
    <button role="tab" aria-selected="false" data-tab="ci">Sunday check-in</button>
  </nav>

  <section id="tab-plan">
    <div class="wkbar">
      <button id="prev" aria-label="Previous week">Previous</button>
      <button id="next" aria-label="Next week">Next</button>
      <button class="today" id="goNow">This week</button>
    </div>
    <div id="restBanner" class="banner hidden"><b>Rest until Sun 25 Oct.</b> Yoga and easy swims only. Base starts Mon 26 Oct.</div>
    <div id="week"></div>
  </section>

  <section id="tab-races" class="hidden"></section>
  <section id="tab-gym" class="hidden"></section>
  <section id="tab-yoga" class="hidden"></section>
  <section id="tab-ch" class="hidden"></section>
  <section id="tab-zones" class="hidden"></section>
  <section id="tab-ci" class="hidden"></section>

  <div class="foot"><span id="store">Saving on this device</span><button id="reset">Clear all ticks</button></div>
</div>
<div class="toast" id="toast">Saved</div>

<script>
/* ============ dates ============ */
const START=new Date(2026,9,26); // Mon 26 Oct 2026
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayDate=(w,d)=>{const x=new Date(START);x.setDate(x.getDate()+w*7+d);return x};
const fd=x=>x.getDate()+' '+MN[x.getMonth()];
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const RACES=[
 {k:'plo',n:'Plovdiv Marathon',d:new Date(2027,3,18,9),goal:'Sub-4:30',sub:'6:24/km, all-out',c:'var(--mara)',w:24},
 {k:'bai',n:'Asenovgradski Bairi 50k',d:new Date(2027,4,9,7),goal:'Finish',sub:'Beat cut-offs with a buffer',c:'var(--bairi)',w:27},
 {k:'vit',n:'Vitosha 100',d:new Date(2027,5,26,6),goal:'Finish',sub:'Date to confirm',c:'var(--vit)',w:34}
];

/* ============ session builders ============ */
const S=(z,t,d,m,x)=>Object.assign({z,t,d,m},x||{});
const EZ='HR 148–160. You can talk in full sentences.';
const E=(m,x)=>S('easy',`Easy run ${m} min`,x||EZ,m);
const R=(m,x)=>S('rec',`Recovery run ${m} min`,x||'HR under 148. As easy as it gets. Do it, then go home.',m);
const L=(t,d,m)=>S('easy',t,d,m,{long:1});
const V=(vert,m,x)=>S('vert',`Mladezhki Halm vert, ~${vert} m`,x||'Hike up hard but controlled, jog down easy. Hiking is training, not failure.',m);
const ST=(t,d,m)=>S('st',t,d,m,{key:1});
const HD=(t,d,m)=>S('hard',t,d,m,{key:1});
const MPS=(t,d,m)=>S('mp',t,d,m,{key:1});
const GA=(x)=>S('gym','Gym A: lower body and power',x||'See Strength tab. 35–40 min, after the run.',38,{g:'A'});
const GB=(x)=>S('gym','Gym B: upper body',x||'See Strength tab. 30 min, home or gym.',30,{g:'B'});
const GC=(v)=>S('gym','Hybrid session '+v,'See Strength tab. 25–30 min, low leg load.',28,{g:'C'});
const CORE=()=>S('gym','Core 12 min','Dead bug, side plank, Pallof press, bird dog, hollow hold. 2 rounds.',12);
const SWIM=(m)=>S('swim',`Recovery swim ${m||'20–30'} min`,'Easy, any stroke. Loosens the legs. Not a workout.',25);
const REST=()=>S('rest','Rest','Yoga and stretching only.',0);
const T=(t,d,m)=>S('test',t,d,m||25,{test:1});
const RACE=(t,d)=>S('race',t,d,0,{race:1});
const WU=m=>`Warm up 15 min easy with 4 strides. ${m} Cool down 10 min.`;
const float=(n,f)=>MPS(`${n}×800 m with floats`,WU(`${n}×800 m at 5:15/km (4:12 each). Between reps, no stopping: 400 m float at ${f}/km. Goal: hold marathon pace on tired legs.`),70);
const subT=(t,m)=>ST(`Sub-threshold ${t}`,WU(`${t} at HR 170–176. Controlled. You could do one more rep at the end.`),m);
const fourx4=()=>HD('Norwegian 4×4',WU(`4×4 min at HR 188–200, 3 min easy jog between. Hard, but rep 4 is the same pace as rep 1.`),55);

/* ============ phases ============ */
const PH={base:['Base','var(--base)'],build:['Build 1','var(--build)'],mara:['Marathon block','var(--mara)'],taper:['Taper','var(--taper)'],bairi:['Bairi','var(--bairi)'],vit:['Vitosha','var(--vit)']};

/* ============ the season: 35 weeks ============
   each week: phase, title, target, vert, light(deload), why, days[Mon..Sun] */
const W=[];
const wk=(p,title,km,vert,why,days,o)=>W.push(Object.assign({p,title,km,vert,why,days},o||{}));

/* --- BASE --- */
wk('base','Return to running','22 km','~200 m','<b>All easy.</b> You are 2 weeks off after the marathon. Strength stops 2–3 reps before failure. Learn the gym movements.',[
 [E(30,'HR under 150. First run back. Start slower than feels natural.'),GA('Technique week: light loads, 2 sets each. No jumps yet.')],
 [E(35,'HR under 150. Finish with 4×20 s strides, walk back between.'),GB('Light: 3 sets each, stop 3 reps short.')],
 [V(200,45,'2 laps. Hike up, jog down easy.')],
 [E(30),CORE()],
 [L('Long easy run 60 min','HR under 155. Time, not distance.',60)],
 [SWIM()],
 [S('gym','Rower + easy circuit','Rower 10 min easy. Then 3 easy rounds: 5 pull-ups, 10 push-ups, 15 squats. Not timed.',25)]
],{light:1});
wk('base','Baseline tests','26 km','~300 m','<b>Test week.</b> These numbers set your challenge targets. Rest 5–10 min between tests on the same day.',[
 [E(30,'Easy, then 4×20 s strides.'),T('Test: broad jump + 2k row','Broad jump: best of 3, measure toe to heel. Then 2k row all-out (damper 4–5). Write both in Challenges.',30)],
 [E(35),T('Test: dead hang, max pull-ups, Bring Sally Up','In this order, 5–10 min rest between. Strict pull-ups, full hang.',30)],
 [V(300,50,'3 laps.')],
 [E(35),T('Test: max push-ups','One set, chest to fist height, no rest at the top.',5),CORE()],
 [L('Long easy run 70 min','HR under 155.',70)],
 [SWIM()],
 [T('Test: Cindy','20 min: 5 pull-ups, 10 push-ups, 15 air squats, as many rounds as you can. Use a band for pull-ups if needed and write the band down.',30)]
]);
wk('base','First sub-threshold','30 km','~350 m','<b>Monday is your first quality day.</b> Sub-threshold should feel controlled, never a fight.',[
 [subT('5×5 min, 1 min jog',55),GA()],
 [E(35),GB()],
 [V(350,55,'3–4 laps.')],
 [E(40),CORE()],
 [L('Long easy run 75 min','HR under 155.',75)],
 [SWIM()],
 [T('Test: Fran, scaled','21-15-9: thrusters at 30 kg and pull-ups. Learn the thruster first: 3×5 light before you start the clock.',30)]
]);
wk('base','Build','33 km','~400 m','First Rodopi day of the season on Friday.',[
 [subT('6×5 min, 1 min jog',60),GA()],
 [E(40,EZ+' Finish with 4×20 s strides.'),GB()],
 [V(400,60,'4 laps.')],
 [E(40),CORE()],
 [L('Rodopi trail day 1:30','Easy on trails. Hike the steep parts. Eat something at 45 min.',90)],
 [SWIM()],
 [GC('C1')]
]);
wk('base','Build','36 km','~450 m','Last build week before the trip.',[
 [subT('5×6 min, 1 min jog',60),GA()],
 [E(40),GB()],
 [V(450,60,'4 laps.')],
 [E(45),CORE()],
 [L('Long easy run 90 min','HR under 155. Take a gel or snack at 60 min.',90)],
 [SWIM()],
 [GC('C2')]

const YC={g:'var(--easy)',a:'var(--mp)',r:'var(--hard)'}, YN={g:'Green',a:'Amber',r:'Red'};
const RESTO=/Restorative|Fascia|Rollout|Recover|After Training|Yin|Pushing Hard|Rest Day/i;
const CALM=/Meditation|Breathwork|Breathing|Pranayama|Sleep|Before Bed/i;
const yPool=(c,re)=>YV.filter(v=>v[1]===c&&(!re||re.test(v[0])));
const pickV=(pool,n)=>{const pr=pool.filter(v=>v[2]);const use=(pr.length&&n%2===0)?pr:pool;return use[n%use.length]};
function yogaPlan(wi,w,d,items){
  const n=wi*7+d;
  const race=items.some(x=>x.race), longDay=items.some(x=>x.long);
  const nextLong=(w.days[d+1]||[]).some(x=>x.long), prevLong=d>0&&w.days[d-1].some(x=>x.long);
  const recov=w.light&&/^Recover/.test(w.title);
  if(race)     return ['g','Restorative, evening after the race','Very gentle. No deep stretching for 3 days.',pickV(yPool('g',RESTO),n),10];
  if(w.race)   return ['g','Sleep or breathwork only','Race week: no flows.',pickV(yPool('g',CALM),n),15];
  if(recov)    return ['g','Green, restorative','Recovery week: gentle only.',pickV(yPool('g',RESTO),n),20];
  if(longDay)  return ['g','Restorative or fascia release, evening','',pickV(yPool('g',RESTO),n),20];
  if(nextLong) return ['g','Green only, light','No deep hip openers before the long run.',pickV(yPool('g'),n),15];
  if(prevLong) return ['g','Green, 15–25 min','Day after the long run.',pickV(yPool('g',RESTO),n),20];
  if(w.light)  return ['g','Green, 15–20 min','Lighter week.',pickV(yPool('g'),n),15];
  if(d===0&&items.some(x=>x.key)&&w.p!=='taper') return ['r','Red allowed, once a week max','Training, not recovery. If it gives you DOMS, it counts as a strength session.',pickV(yPool('r'),n),25];
  if(d===1||d===6) return ['a','Amber, 20–30 min','',pickV(yPool('a'),n),25];
  return ['g','Green, 15–25 min','',pickV(yPool('g'),n),20];
}

let db=null, uid=null, saveT=null;
function localGet(){try{return JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){return null}}
function localSet(){try{localStorage.setItem(LKEY,JSON.stringify(state))}catch(e){}}
function merge(s){if(!s)return;state=Object.assign({checks:{},logs:{},tests:[],ci:{},bairiCP:''},s)}
function save(){
  localSet();
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    if(db&&uid){try{await db.doc(`data/users/${uid}/season`).set({s:JSON.stringify(state),at:Date.now()});toast('Saved')}
      catch(e){toast('Saved on this device only')}}
    else toast('Saved on this device');
  },700);
}
async function connect(){
  try{
    if(!window.claude||!claude.use)return;
    const u=await claude.use('user'); db=await claude.use('db');
    if(!db||!u){db=null;return}
    uid=await u.id(); if(!uid){db=null;return}
    const snap=await db.doc(`data/users/${uid}/season`).get();
    if(snap.exists){try{merge(JSON.parse(snap.data().s));localSet()}catch(e){}}

}

 {k:'tenk',n:'10k',u:'time',goal:'Sub-50, March',lower:true},
 {k:'fivek',n:'5k',u:'time',goal:'Sub-20, from July 2027',lower:true}
];
function renderYoga(){
  const li=v=>`<li><a class="${v[2]?'p':''}" href="${ylink(v[0])}" target="_blank" rel="noopener">${esc(v[0])}</a></li>`;
  const prio=YV.filter(v=>v[2]&&v[1]!=='r');
  const sec=(c,title,txt)=>`<div class="panel"><h3>${title}<span class="yc">${YV.filter(v=>v[1]===c).length} videos</span></h3>
    <div class="pc" style="padding-bottom:0"><p style="font-size:13.5px;color:var(--soft);margin:0 0 4px">${txt}</p></div>
    <ul class="ylist">${YV.filter(v=>v[1]===c).map(li).join('')}</ul></div>`;
  document.getElementById('tab-yoga').innerHTML=`
  <div class="panel"><h3>How it fits the week</h3><div class="pc">
    <p>Afternoons, after the morning session. Every day in the Plan tab has a <b>PM yoga</b> line with the colour for that day and a suggested video.</p>
    <table><tr><th>Day</th><th>Afternoon yoga</th></tr>
    <tr><td><b>Mon</b>, quality + Gym A</td><td><span style="color:var(--hard)">Red</span> allowed, once a week max. Not in taper.</td></tr>
    <tr><td><b>Tue</b>, recovery + Gym B</td><td><span style="color:var(--mp)">Amber</span></td></tr>
    <tr><td><b>Wed</b>, vert</td><td><span style="color:var(--easy)">Green</span></td></tr>
    <tr><td><b>Thu</b>, day before long run</td><td><span style="color:var(--easy)">Green</span> only, light. No deep hip openers.</td></tr>
    <tr><td><b>Fri</b>, long run</td><td>Restorative or fascia release, evening</td></tr>
    <tr><td><b>Sat</b>, rest</td><td><span style="color:var(--easy)">Green</span>, restorative</td></tr>
    <tr><td><b>Sun</b>, light day</td><td><span style="color:var(--mp)">Amber</span></td></tr>
    <tr><td><b>Lighter weeks</b></td><td><span style="color:var(--easy)">Green</span> only</td></tr>
    <tr><td><b>Race weeks</b></td><td>Sleep and breathwork only</td></tr></table>
    <div class="note warn"><b>The test:</b> if a session gives you DOMS, it was training, not recovery. It counts against your strength sessions for the week, not on top of them.</div></div></div>
  <div class="panel"><h3>★ Priority<span class="yc">${prio.length} videos</span></h3>
    <div class="pc" style="padding-bottom:0"><p style="font-size:13.5px;color:var(--soft);margin:0 0 4px">Ankles, toes, knees, hips, back and fascia. These protect you through the vert and the ultras.</p></div>
    <ul class="ylist">${prio.map(li).join('')}</ul></div>
  ${sec('g','Green: daily','Yin, restorative, mobility, breathwork, sleep. You should finish looser than you started.')}
  ${sec('a','Amber: twice a week','Moderate flows. Not the day before the long run, not the day after.')}
  ${sec('r','Red: once a week max','Training, not recovery. Arm balances and handstands are fine in base (Nov–Jan) as upper-body work. Drop them from mid-February, when the marathon block starts.')}`;
}
function renderCh(){
  const el=document.getElementById('tab-ch');
  const t0=new Date(); const iso=`${t0.getFullYear()}-${String(t0.getMonth()+1).padStart(2,'0')}-${String(t0.getDate()).padStart(2,'0')}`;
  el.innerHTML=`<div class="panel"><h3>Challenges</h3><div class="pc" style="padding-bottom:4px">
    <p>Tests: early Nov, late Dec, late Jan, early Mar. Then paused until July. Never within 10 days of a race.</p></div>
    ${TESTS.map(t=>{const h=state.tests.filter(x=>x.k===t.k);
      return `<div class="ch"><div class="ch-h"><b>${t.n}</b><span class="ch-goal">Goal: ${esc(t.goal)}</span></div>
      <div class="ch-hist">${h.length?h.map((x,i)=>`${i===h.length-1?'<span class="best">':''}${esc(x.date.slice(5).split('-').reverse().join('.'))}: ${esc(x.v)}${i===h.length-1?'</span>':''} <button class="x" data-del="${state.tests.indexOf(x)}" aria-label="Delete result">✕</button>`).join(', '):'No result yet.'}</div>
      <div class="ch-add"><input type="date" value="${iso}" id="d-${t.k}" aria-label="Date"><input placeholder="${esc(t.u)}" id="v-${t.k}" aria-label="${esc(t.n)} result"><button class="btn" data-add="${t.k}">Add</button></div></div>`}).join('')}</div>`;
}
function renderZones(){
  document.getElementById('tab-zones').innerHTML=`
  <div class="panel"><h3>Heart rate zones</h3><div class="pc"><p>HRmax 210, threshold HR 182.</p><div class="tw">
    <table><tr><th>Zone</th><th>HR</th><th>Used for</th></tr>
    <tr><td><span class="sw" style="background:var(--rec)"></span>Recovery</td><td>under 148</td><td>Recovery runs, day after hard days</td></tr>
    <tr><td><span class="sw" style="background:var(--easy)"></span>Easy</td><td>148–160</td><td>Easy and long runs. About 80% of all running.</td></tr>
    <tr><td><span class="sw" style="background:var(--mp)"></span>Marathon</td><td>158–168</td><td>Marathon pace, floats, dress rehearsal</td></tr>
    <tr><td><span class="sw" style="background:var(--st)"></span>Sub-threshold</td><td>170–176</td><td>Norwegian-style Monday reps</td></tr>
    <tr><td><span class="sw" style="background:var(--hard)"></span>Hard</td><td>185–200</td><td>4×4, 10k test</td></tr>
    <tr><td><span class="sw" style="background:var(--vert)"></span>Vert</td><td>by feel</td><td>Hike hard up, easy down</td></tr></table></div></div></div>
  <div class="panel"><h3>Paces</h3><div class="pc"><table>
    <tr><th>What</th><th>Pace</th></tr>
    <tr><td>Marathon pace (sub-4:30)</td><td>6:24/km</td></tr>
    <tr><td>10k goal (sub-50)</td><td>5:00/km</td></tr>
    <tr><td>800 m reps</td><td>5:15/km, 4:12 each</td></tr>
    <tr><td>Floats, Feb → Mar</td><td>7:15 → 7:00 → 6:45 → 6:30 → 6:24/km</td></tr></table>
    <p style="font-size:13.5px;color:var(--soft)">Easy runs go by HR, not pace.</p></div></div>
  <div class="panel"><h3>Coach rules</h3><div class="pc"><ul>
    <li><b>Morning HR 7+ above normal:</b> today becomes a rest day.</li>
    <li><b>Pain longer than 2–3 days:</b> drop the load first, then tell Claude in the check-in.</li>
    <li><b>Never two hard days in a row.</b> If a day moves, move the easy day, not the hard one.</li>
    <li><b>Missed a session?</b> Do not make it up. Carry on with the plan.</li>
    <li><b>Garmin load ratio above 1.3:</b> cut the next 2 days to easy.</li>
    <li><b>Heat above 25 °C:</b> follow HR, let pace go.</li>
    <li><b>Runs over 90 min:</b> eat every 30–40 min.</li>
    <li><b>Weight loss:</b> small, steady deficit on easy days. Eat fully around hard days and long runs.</li></ul></div></div>`;
}
function weekSummary(){
  const w=W[wsel]; const ci=state.ci[wsel]||{};
  let lines=[`Week ${wsel+1} (${fd(dayDate(wsel,0))}–${fd(dayDate(wsel,6))}): ${w.title}. Target ${w.km}, vert ${w.vert}.`];
  let km=0,min=0,yd=0;
  w.days.forEach((items,d)=>items.forEach((x,i)=>{const k=id(wsel,d,i);if(x.z==='rest')return;if(x.z==='yoga'){if(state.checks[k])yd++;return}const lg=state.logs[k]||{};
    if(lg.km)km+=parseFloat(lg.km)||0; if(lg.t)min+=parseFloat(lg.t)||0;
    lines.push(`${state.checks[k]?'[x]':'[ ]'} ${DN[d]} ${x.t}${lg.t||lg.km||lg.hr?` — ${[lg.t&&lg.t+' min',lg.km&&lg.km+' km',lg.hr&&'HR '+lg.hr].filter(Boolean).join(', ')}`:''}${lg.n?` — "${lg.n}"`:''}`)}));
  lines.push(`Logged: ${km.toFixed(1)} km, ${Math.round(min)} min. Yoga: ${yd} of 7 days.`);
  if(ci.rhr)lines.push(`Resting HR: ${ci.rhr}`); if(ci.wt)lines.push(`Weight: ${ci.wt} kg`);
  if(ci.load)lines.push(`Garmin load ratio: ${ci.load}`); if(ci.sleep)lines.push(`Sleep: ${ci.sleep}`);
  if(ci.pain)lines.push(`Pain or niggles: ${ci.pain}`); if(ci.notes)lines.push(`Notes: ${ci.notes}`);
  lines.push('Please review this week and adjust next week if needed.');
  return lines.join('\n');
}
function renderCI(){
  const ci=state.ci[wsel]||{};
  document.getElementById('tab-ci').innerHTML=`<div class="panel"><h3>Sunday check-in, week ${wsel+1}</h3><div class="pc">
    <p>Fill this in on Sunday, copy it, and paste it to Claude. Claude adjusts next week from it.</p>
    <div class="ci">
      <div><label for="ci-rhr">Avg morning HR</label><input id="ci-rhr" data-ci="rhr" inputmode="numeric" value="${esc(ci.rhr||'')}"></div>
      <div><label for="ci-wt">Weight (kg)</label><input id="ci-wt" data-ci="wt" inputmode="decimal" value="${esc(ci.wt||'')}"></div>
      <div><label for="ci-load">Garmin load ratio</label><input id="ci-load" data-ci="load" inputmode="decimal" value="${esc(ci.load||'')}"></div>
      <div><label for="ci-sleep">Sleep</label><select id="ci-sleep" data-ci="sleep">${['','Good','OK','Poor'].map(o=>`<option ${ci.sleep===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="full"><label for="ci-pain">Pain or niggles</label><input id="ci-pain" data-ci="pain" value="${esc(ci.pain||'')}" placeholder="None, or where and how long"></div>
      <div class="full"><label for="ci-notes">How the week felt</label><textarea id="ci-notes" data-ci="notes">${esc(ci.notes||'')}</textarea></div>
    </div>
    <p style="margin-top:12px"><button class="btn" id="ciCopy">Copy check-in</button> <button class="btn ghost" id="ciShow">Show text</button></p>
    <textarea id="ciOut" class="hidden" readonly aria-label="Check-in text"></textarea>
    <p style="font-size:13px;color:var(--soft)">Uses the week shown in the Plan tab. Change weeks there.</p></div></div>`;
}
function renderAll(){renderHero();renderWeek();renderRaces();renderGym();renderYoga();renderCh();renderZones();renderCI()}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.k){const k=b.dataset.k;state.checks[k]=!state.checks[k];if(!state.checks[k])delete state.checks[k];renderWeek();save();return}
  if(b.dataset.lg){openLog=openLog===b.dataset.lg?null:b.dataset.lg;renderWeek();if(openLog){const i=document.getElementById('t-'+openLog);i&&i.focus()}return}
  if(b.dataset.w!=null){wsel=+b.dataset.w;openLog=null;renderHero();renderWeek();renderCI();tab('plan');return}
  if(b.dataset.tab){tab(b.dataset.tab);return}
  if(b.dataset.add){const k=b.dataset.add;const v=document.getElementById('v-'+k).value.trim();const d=document.getElementById('d-'+k).value;
    if(!v){document.getElementById('v-'+k).focus();return}
    state.tests.push({k,date:d||new Date().toISOString().slice(0,10),v});state.tests.sort((a,b)=>a.date.localeCompare(b.date));renderCh();save();return}
  if(b.dataset.del!=null){if(!confirm('Delete this result?'))return;state.tests.splice(+b.dataset.del,1);renderCh();save();return}
  if(b.id==='prev'&&wsel>0){wsel--;openLog=null;renderHero();renderWeek();renderCI();return}
  if(b.id==='next'&&wsel<W.length-1){wsel++;openLog=null;renderHero();renderWeek();renderCI();return}
  if(b.id==='goNow'){wsel=curWeek();openLog=null;renderHero();renderWeek();renderCI();return}
  if(b.id==='reset'){if(!confirm('Clear every ticked session? Logs and test results stay.'))return;state.checks={};renderWeek();save();return}
  if(b.id==='ciShow'||b.id==='ciCopy'){const o=document.getElementById('ciOut');o.value=weekSummary();o.classList.remove('hidden');
    if(b.id==='ciCopy'){(navigator.clipboard?navigator.clipboard.writeText(o.value):Promise.reject()).then(()=>toast('Copied')).catch(()=>{o.select();toast('Select all and copy')})}
    else{o.select()}return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.lk){const k=t.dataset.lk;state.logs[k]=state.logs[k]||{};state.logs[k][t.dataset.f]=t.value;
    if(!Object.values(state.logs[k]).some(Boolean))delete state.logs[k];save();return}
  if(t.dataset.ci){state.ci[wsel]=state.ci[wsel]||{};state.ci[wsel][t.dataset.ci]=t.value;save()}
});
document.addEventListener('change',e=>{if(e.target.dataset.ci){state.ci[wsel]=state.ci[wsel]||{};state.ci[wsel][e.target.dataset.ci]=e.target.value;save()}});
function tab(n){
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===n?'true':'false'));
  ['plan','races','gym','yoga','ch','zones','ci'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('hidden',t!==n));
  if(n==='plan')renderWeek();
}

/* ============ start ============ */
merge(localGet());
wsel=curWeek();
renderAll();
connect();
</script>
